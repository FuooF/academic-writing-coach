name: Validate skill

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run isolated tooling tests
        run: python -m unittest discover -s tests -v
      - name: Check standalone lookup
        run: python scripts/lookup.py search "literature synthesis" --dataset builtin --limit 3 --json
      - name: Build public packages
        run: python scripts/build_release.py --output "${{ runner.temp }}/release-artifacts"
      - uses: actions/upload-artifact@v7
        with:
          name: public-packages-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/release-artifacts/*
          if-no-files-found: error
          retention-days: 7
